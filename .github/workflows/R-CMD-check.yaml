# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, joss]
  pull_request:
    branches: [main, master, joss, mlysy_devel]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})${{ matrix.config.rcppeigen_dev && ' RcppEigen-dev' || '' }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'release', rcppeigen_dev: true}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release', rcppeigen_dev: true}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: https://inla.r-inla-download.org/R/stable/

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          cache-version: ${{ matrix.config.rcppeigen_dev && 'rcppeigen-dev' || '1' }}

      - name: Install dev RcppEigen from r-universe
        if: matrix.config.rcppeigen_dev
        run: |
          install.packages("RcppEigen", repos = "https://rcppcore.r-universe.dev")
        shell: Rscript {0}

      - name: Report RcppEigen / Eigen version
        run: |
          cat("RcppEigen:", format(packageVersion("RcppEigen")), "\n")
          inc <- system.file("include", "Eigen", package = "RcppEigen")
          hdrs <- list.files(inc, recursive = TRUE, full.names = TRUE)
          defs <- unlist(lapply(hdrs, function(f)
            grep("^#define EIGEN_(WORLD|MAJOR|MINOR|PATCH)_VERSION\\b",
                 readLines(f, warn = FALSE), value = TRUE)))
          writeLines(unique(defs))
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
